[package]
name = "lumbergui"
version = "0.1.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/wood-work/lumberjack"
description = "The iced interface to lumberdaq"

[dependencies]
lumberdaq = { path = "../lumberdaq" }
# Not a new crate in the tree: lumberdaq already uses it, and a DataPoint
# carries a chrono timestamp, so anything plotting one has to name the type.
chrono = "0.4"
# `svg` for the brand marks: the logo and the two mode icons are vector, and
# they should stay sharp at every font size the settings offer. It pulls resvg
# in, which is the cost of rendering SVG at all - the alternative is a PNG per
# size, which is worse.
# `markdown` is a feature of iced rather than a dependency of its own, and
# brings pulldown-cmark with it. It is here for the formula help, whose
# content is prose with headings, lists and code in it - laying that out by
# hand meant a column of text widgets whose sizes and spacing drifted apart.
iced = { version = "0.14", features = ["svg", "markdown"] }
# The native folder picker. There is no answer to "choose a directory" in iced
# or in std, and typing a path into a text field is the alternative. Used only
# from the file menu, and only its blocking form: the dialog is modal, so the
# window behind it is meant to be waiting anyway.
rfd = "0.17"
iced_fonts = { version = "0.3", features = ["lucide"] }
iced_plot = "0.5"
# Already in the tree: iced's `svg` feature builds it to draw the marks. Named
# here as well so the window icon can be rasterised from the same logo the
# interface draws, rather than keeping a second copy of it as a PNG that could
# fall out of step. Default features off: the image formats it can decode are
# for embedded bitmaps, which our marks do not have.
resvg = { version = "0.45", default-features = false }
# Already compiled for lumberdaq, whose configs are JSON: the user settings
# file is the same idea, so it uses the same tools rather than a hand-rolled
# parser.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Already in the tree by way of ctrlc, rfd and softbuffer. Named here so the
# interface can hear from Windows when a device is plugged in or unplugged,
# rather than opening every device on a timer to find out - which would reset
# a serial board every time it looked.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# Only to give the executable its icon and its name in Explorer, which has to
# be compiled into the binary before it runs. `resvg` again, so the icon is
# rendered from the same logo the interface draws rather than from a second
# copy kept beside it.
[build-dependencies]
resvg = { version = "0.45", default-features = false }
winresource = "0.1"
