[package]
name = "choptui"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/willhunt/lumberjack"
description = "Terminal monitor for a lumberdaq acquisition"

# lumberdaq and nothing else so far. Drawing comes later; what matters now is
# that this is a separate crate, so everything it uses has to be public API.
[dependencies]
lumberdaq = { path = "../lumberdaq" }
# Not a new crate in the tree: lumberdaq already uses it, and a DataPoint
# carries a chrono timestamp, so anything reading one needs to name the type.
chrono = "0.4"
# Also already in the tree. The plot layout is a file, and a ChannelRef in it is
# serialised by the same derives the library uses for its own config.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.30.2"
